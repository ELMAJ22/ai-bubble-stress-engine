name: Daily ABSI update

on:
  schedule:
    - cron: "17 3 * * 1-5"   # 03:17 UTC on weekdays
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Fetch data and re-score
        run: python scripts/update_data.py
      - name: Save results
        run: |
          git config user.name "absi-bot"
          git config user.email "absi-bot@users.noreply.github.com"
          git add data README.md
          git diff --cached --quiet || git commit -m "Daily ABSI update $(date -u +%F)"
          git push
